name: CIS Kubernetes Security Scan

on:
  push:
    paths:
      - "k8s/**"
      - ".github/workflows/cis-security.yml"
  pull_request:
    paths:
      - "k8s/**"

jobs:
  security-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Scan Kubernetes manifests
        uses: kubescape/github-action@main
        with:
          files: "k8s/*.yaml"
          frameworks: "cis-v1.23-t1.0.1"
          format: json
          outputFile: kubescape-results
          severityThreshold: high