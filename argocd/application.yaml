apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: irrigation-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/YOUR_USERNAME/ai-irrigation-gitops.git
    targetRevision: HEAD
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: irrigation
  syncPolicy:
    automated:
      prune: true
      selfHeal: true